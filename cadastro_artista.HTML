<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Novo Artista - Sistema MUsical</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%27https://ww.w3.org/2000/svg% viewBox=%270 0 100 100%27><text y=%27.9em%27 font-size=%2790%27>🎵</text></svg>">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="container">

    <!-- A mesma barra de título da Biblioteca(o Css já existe desde a aula 2) -->
     <div class="page-header-bar">
        <h2🎤 Novo Artista</h2>
        <div class="header-actions">
            <a href="Index.HTML"  class="btn-back">⬅ Voltar ao Menu</a>
        </div>
     </div>

     <!-- Formulário de cadastro do artista (o "Criador") -->
      <form method="post" action="#" enctype="multipart/form-data">
        <div class="form-grid">
            <label for="nome">Nome do Artista <span style="color: var(--red)">*</span></label>
            <input type="text" id="nome" name="nome"
            required placeholder="Ex: Djavan, Marisa Monte...">
        

          <div class="form-group">
            <label for="genero">Gênero Musical</label>
            <input type="text" id="genero" name="genero"
                   placeholder="Ex: MPB, Rock, Samba...">
          </div>

         <div class="form-group">
            <label for="pais">País</label>
            <input type="text" id="pais" name="pais"
              placeholder="Ex: Brasil, EUA...">
         </div>

         <div class="form-group">
            <label for="imagem">Foto do Artista</label>
            <input type="file" id="imagem" name="imagem" accept="image/*">
            <small>JPG ou PNG . Máximo 5 MB</small>
         </div>
         
        </div><!--fim.form-grid-->

        <!-- form-actions: a área dos botões do formulário (flex). -->
         <div class="form-actions">
            <button type="submit" class="btn-primary">➕ Cadastrar</button>
         </div>
      </form>

      <!-- ===== TABELA DOS ARTISTAS ===== -->
       <h3>📋 Artistas Cadatrados</h3> <!--subtítulo da tabela-->

       <div class="table-container">
           <table>
             <thead>
                <tr>
                    <th class="col-foto">Foto</th>
                    <th>Nome</th>
                    <th>Gênero</th>
                    <th>País</th>
                    <th class="col-acoes">Ações</th>
                </tr>
             </thead>
             <tbody>
                <!-- Cada tr = um artista -->
                 <tr>
                    <td><div class="no-image">Sem<br>foto</div></td>
                    <td>Djavan</td>
                    <td>MPB</td>
                    <td>Brasil</td>
                    <td>
                        <div class="action-buttons">
                            <a href="#" class="btn-edit">✏️Editar</a>
                            <a href="#" class="btn-delete">🗑️</a>
                            <a href="cadastro_musica.HTML" class="btn-music">🎵 Músicas</a>
                        </div>
                    </td>
                 </tr>
                 <tr>
                    <td><div class="no-image">Sem<br>foto</div></td>
                    <td>Marisa Monte</td>
                    <td>MPB</td>
                    <td>Brasil</td>
                    <td>
                        <div class="action-buttons">
                            <a href="#" class="btn-edit">✏️ Editar</a>
                            <a href="#" class="btn-delete">🗑️</a>
                            <a href="cadastro_musica.HTML" class="btn-music">🎵 Músicas</a>
                        </div>
                    </td>

                 </tr>
             </tbody>
           </table>
       </div>
</div>
    
</body>
</html>
