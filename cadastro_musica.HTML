<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nova Música - Sistema Musical</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%27https://ww.w3.org/2000/svg% viewBox=%270 0 100 100%27><text y=%27.9em%27 font-size=%2790%27>🎵</text></svg>">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="container">

 <!-- Aqui o botão volta para os ARTISTAS: chegamos nesta tela pelo botão verde "Músicas" -->
    <div class="page-header-bar">
        <h2>🎵 Nova Música</h2>
        <div class="header-actions">
            <a href="cadastro_artista.HTML" class="btn-back">⬅ Voltar para Artista</a>
        </div>
    </div>

     <!-- FORMULÁRIO DA MÚSICA (a "obra"). Igual ao do artista:post, enctype e form-grid -->
    <form method="post" action="#" enctype="multipart/form-data">

        <div class="form-grid">
            <!-- Linha 1: Artista + Título -->
            <div class="form-group">
                <label for="artista_id">Artista <span style="color: var(--red)">*</span></label>

                <select name="artista_id" id="artista_id" required>
                    <option value="">Selecione Um Artista</option>
                    <option value="1">Djavan</option>
                    <option value="2">Marisa Monte</option>
                </select>
            </div>

            <div class="form-group">
                <label for="genero">Gênero</label>
                <input type="text" id="genero" name="genero" placeholder="Ex: MPB, Rock...">
            </div>

            <!-- Youtube + Capa -->
             <div class="form-group">
                <label for="youtube_link"> Link do Youtube <span style="color: var(--red);">*</span></label>
                <!-- type="url": o navegador confere se é um endereço de internet (http...) -->
                 <input type="url" id="youtube_link" name="youtube_link"
                 required placeholder="https://www.youtube.com/watch?v=...">
                 <small>Cole a URL do vídeo (não do canal ou playlist).</small>
            </div>

            <div class="form-group">
                <label for="imagem_capa"> Capa do álbum</label>
                <!-- O mesmo campod e foto do artista: só imagens -->
                 <input type="file" id="imagem_capa" name="imagem_capa" accept="image/*">
                 <small>JPG ou PNG . Máximo 5 MB</small>
            </div>

            <!-- Letra. A classe "full" faz este campo ocupar as 2 colunas (grid-column: 1/ -1) -->
             <div class="form-group full">
               <label for="letra">Letra da Música</label>
               <!-- textarea: caixa de texto com várias linhas. Diferente do input, ela tem fechamento -->
                <textarea id="letra" name="letra" placeholder="Cole a letra aqui (opcional)..."></textarea>
            </div>

        </div><!--fim.fomr-grid-->

        <div class="form-actions">
            <button type="submit" class="btn-primary">➕ Cadastrar</button>
        </div>
    </form>

    <!-- ==== TABELA DE MÚSICAS DO ARTISTA (dados ifxos nesta fase) ==== -->
    <h3>🎵 Músicas Cadastradas</h3>
    <div class="table-container">
        <table>
            <thead>
                <tr>
                    <th class="col-capa">Capa</th>
                    <th> Título</th>
                    <th> Álbum</th>
                    <th class="col-youtube">Youtube</th>
                    <th class="col-acoes">Ações</th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <td><div class="no-image">Sem<br>capa</div></td>
                    <td>Oceano</td>
                    <td>Luz</td>
                    <!-- Abre o vídeo numa aba nova -->
                    <td><a href="#" target="_blank" class="btn-youtube">▶ Assistir</a></td>
                    <td>
                        <div class="action-buttons">
                            <a href="#" class="btn-edit">✏️Ediatr</a>
                            <a href="#" class="bnt-delete">🗑️</a>
                        </div>
                    </td>

                </tr>
            </tbody>
        </table>

    </div>      
</div>   
    
</body>
</html>
