<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Biblioteca Musical - Sistema Musical</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%27http:www.w3.org/2000/svg%27 viewBox=%270 0 100 100%27><text y=%27.9em%27 font-size=%2790%27>🎵</text></svg>">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="container">

    <!-- ==== CABEÇALHO DA PÁGINA ==== -->
     <div class="page-header-bar">
        <h2>🎼 Biblioteca Musical</h2>
        <div class="header-actions">
            <a href="Index.HTML" class="btn-back">-Voltar ao Menu</a>
            <a href="cadastro_musica.HTML" class="btn-primary">✚ Nova Música</a>
        </div>
     </div>

<!-- ==== FILTROS 
 Nesta fase eles só aparecem (não filtram de verdade).==== -->
 <!-- na sprint 2 o que a pessoa escolher vai aparecer no endereço (ex.: ?artista=1) e o PHP usa isso para filtrarno banco -->
  <div class="filters">
     <form method="get" class="filter-form" action="#">

        <!-- filter-group: os 3 filtros. 0 CSS (flex) coloca lado a lado -->
        <div class="filter-group">

          <!-- filter-item: um filtro = rótulo + campo -->
          <div class="filter-item">
            <label for="busca">Busca geral</label>
            <input type="text" name="busca" id="busca" placeholder="Título, álbum ou artista...">
           </div>

           <div class="filter-item">
             <label for="artista">Artista</label>
             <!-- Select: lista para escolher uma opção 
             value= "" (vazio) = "todos". O número é o código do artista no banco-->
             <select name="artista" id="artista">
                <option value="">Todos os Artistas</option>
                <option value="1">Djavan</option>
                <option value="2">Marisa Monte</option>
             </select>
            </div>

           <div class="filter-item">
            <label for="genero">Gênero</label>
            <select name="genero" id="genero">
                <option value="">Todos os gêneros</option>
                <option value="MPB">MPB</option>
            </select>
           </div>
        </div>

        <!-- Filter-actions: a área do botão de filtrar -->
         <div class="Filter-actions">
            <button type="submit" class="btn-primary">🔎Filtrar</button>
         </div>
      </form>
    </div>
 <!-- ==== TABELA DE MÚSICA ==== -->
  <!-- table-container: a caixa branca com sobra em volta da tabela -->
  <div class="table-container">
    <table>
        <!-- thead: cabeçalho da tabela. tr= linha th= célula de título -->
         <thead>
            <tr>
                <th class="col-capa">Capa</th>
                <th> Título</th>
                <th>Artista</th>
                <th>Album</th>
                <th>Gênero</th>
                <th class="col-youtube">Youtube</th>
                <th class="col-acoes">Ações</th>
            </tr>
         </thead>

         <tbody>
            <tr>
                <td><div class="no-image">Sem<br>capa</div></td>
                <td>Oceano</td>
                <td>Djavan</td>
                <td>Luz</td>
                <td>MPB</td>

                <td><a href="#" target="_blank" class="btn-youtube">▶︎ Assitir</a></td>
                <td>
                    <div class="action-button">
                        <a href="#" class="btn-edit">✏️ Editar</a>
                        <a href="#" class="btn-delete">🗑️</a>
                    </div>
                </td>
            </tr>
            <tr>
                <td><div class="no-image">Sem<br></div></td>
                <td>Infinito Particular</td>
                <td>Marisa Monte</td>
                <td>-</td> <!-- sem álbum: mostramos um traço-->
                <td>MPB</td>
                <td><a href="#" target="_blank" class="btn-youtube">▶︎ Assitir</a></td>
                <td>
                    <div class="action-buttons">
                        <a href="#" class="btn-edit">✏️ Editar</a>
                        <a href="#" class="btn-delete">🗑️</a>
                    </div>
                </td>
            </tr>
         </tbody>

    </table>
  </div>

</div>
    
</body>
</html>
